version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: legisla-postgres
    environment:
      POSTGRES_DB: legisla_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - legisla-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: legisla-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - legisla-network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: legisla-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - legisla-network

  # Kibana (opcional, para desenvolvimento)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: legisla-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - legisla-network

  # Auth Service
  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile
    container_name: legisla-auth-service
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/legisla_saas
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/auth-service:/app
      - /app/node_modules
    networks:
      - legisla-network

  # Legislation Service
  legislation-service:
    build:
      context: ./apps/legislation-service
      dockerfile: Dockerfile
    container_name: legisla-legislation-service
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/legisla_saas
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=your-super-secret-jwt-key
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis
      - elasticsearch
    volumes:
      - ./apps/legislation-service:/app
      - /app/node_modules
    networks:
      - legisla-network

  # Notification Service
  notification-service:
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
    container_name: legisla-notification-service
    environment:
      - NODE_ENV=development
      - PORT=3003
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your-email@gmail.com
      - SMTP_PASS=your-app-password
      - TWILIO_ACCOUNT_SID=your-twilio-sid
      - TWILIO_AUTH_TOKEN=your-twilio-token
      - TWILIO_PHONE_NUMBER=+1234567890
    ports:
      - "3003:3003"
    depends_on:
      - redis
    volumes:
      - ./apps/notification-service:/app
      - /app/node_modules
    networks:
      - legisla-network

  # API Gateway (Nginx)
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: legisla-api-gateway
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - legislation-service
      - notification-service
    volumes:
      - ./apps/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - legisla-network

  # React Frontend (Development)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: legisla-web
    environment:
      - VITE_API_URL=http://localhost:8080/api
      - VITE_APP_NAME=LegislaSaaS
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - legisla-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:

networks:
  legisla-network:
    driver: bridge